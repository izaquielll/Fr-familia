<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Família FR</title>
<script>
// Link de nutri que ainda não ganhou página própria: leva para a vitrine com a indicação dela
var m = location.pathname.match(/\/n\/([a-z0-9-]+)\/?/i);
if (m) {
  var base = location.pathname.slice(0, location.pathname.indexOf("/n/") + 1);
  var p = new URLSearchParams(location.search); p.set("nutri", m[1].toLowerCase());
  location.replace(base + "?" + p.toString());
} else {
  location.replace("/Fr-familia/");
}
</script>
