name: Páginas das nutris
on:
  workflow_dispatch:
  schedule:
    - cron: "*/15 * * * *"
  push:
    branches: [main]
    paths: ["scripts/**", ".github/workflows/nutris.yml"]
permissions:
  contents: write
concurrency:
  group: nutris
  cancel-in-progress: false
jobs:
  gerar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Instalar Pillow
        run: pip install --quiet pillow
      - name: Gerar páginas das nutris aprovadas
        run: python3 scripts/gerar_nutris.py
      - name: Arte do cupom de aluno (descontos + nutris)
        run: python3 scripts/arte_cupom.py
      - name: Salvar mudanças
        run: |
          git config user.name "familia-fr-robo"
          git config user.email "familia-fr-robo@users.noreply.github.com"
          mkdir -p n && touch n/.keep
          git add -A n combo convite gluteo abdomen metabolica img/og
          if git diff --cached --quiet; then echo "Nada mudou"; exit 0; fi
          git commit -m "Atualiza páginas das nutris"
          git push
